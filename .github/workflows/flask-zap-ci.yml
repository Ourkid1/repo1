name: ZAP Scan with Docker Compose

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Docker Compose file
        run: |
          cat <<EOF > docker-compose.yml
          version: '3'
          services:
            flask:
              image: ghcr.io/ourkid1/flask-app:latest
              ports:
                - "5000:5000"
            zap:
              image: owasp/zap2docker-stable
              command: >
                zap-baseline.py -t http://flask:5000 -r zap-report.html
              depends_on:
                - flask
              networks:
                - zapnet
              volumes:
                - ./zap:/zap/wrk
          networks:
            zapnet:
        EOF

      - name: Create output directory
        run: mkdir zap

      - name: Run ZAP Scan via Docker Compose
        run: docker compose up --abort-on-container-exit

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/zap-report.html
