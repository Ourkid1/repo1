name: Security Scan with OWASP ZAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pull & run your app from GHCR, overriding command to install missing dep then run Flask
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Flask app (install dotenv at runtime)
        run: |
          docker pull ghcr.io/ourkid1/flask-app:latest
          docker run -d --name flask -p 5000:5000 \
            -e FLASK_APP=app.py \
            ghcr.io/ourkid1/flask-app:latest \
            sh -c "pip install --no-cache-dir python-dotenv && flask run --host=0.0.0.0 --port=5000"

      # Robust wait until the app is reachable
      - name: Wait for app to be ready (max ~60s)
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/ >/dev/null; then
              echo "App is up"; exit 0
            fi
            sleep 2
          done
          echo "App not reachable, container logs follow:"
          docker logs --tail 200 flask
          exit 1

      # Let ZAP write its plan/report into the workspace
      - name: Make workspace writable for ZAP
        run: chmod -R 777 "${{ github.workspace }}"

      # Run the official ZAP Baseline Action (it pulls the right image internally)
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://127.0.0.1:5000'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'  # action handles the container
          fail_action: false                              # set to true to fail on alerts
          artifact_name: 'zap-baseline-artifacts'
