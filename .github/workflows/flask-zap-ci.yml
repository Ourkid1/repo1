name: Security Scan with OWASP ZAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Make sure we can upload artifacts even on PRs
permissions:
  contents: read
  packages: read
  actions: write

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pull & run your app from GHCR; install missing dep then start Flask
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Flask app (install dotenv at runtime)
        run: |
          docker pull ghcr.io/ourkid1/flask-app:latest
          docker run -d --name flask -p 5000:5000 \
            -e FLASK_APP=app.py \
            ghcr.io/ourkid1/flask-app:latest \
            sh -c "pip install --no-cache-dir python-dotenv && flask run --host=0.0.0.0 --port=5000"

      - name: Wait for app to be ready (max ~60s)
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/ >/dev/null; then
              echo "App is up"; exit 0
            fi
            sleep 2
          done
          echo "App not reachable, container logs follow:"
          docker logs --tail 200 flask
          exit 1

      # Allow ZAP to write files into the workspace
      - name: Make workspace writable for ZAP
        run: chmod -R 777 "${{ github.workspace }}"

      # Run ZAP Baseline but DON'T ask it to upload artifacts or open issues
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://127.0.0.1:5000'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          fail_action: false
          allow_issue_writing: false
          # (Intentionally NOT setting artifact_name)

      # Upload reports ourselves to avoid the action's artifact upload error
      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json
