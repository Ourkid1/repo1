name: Security Scan with OWASP ZAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Flask App
        run: |
          docker pull ghcr.io/ourkid1/flask-app:latest
          docker run -d -p 5000:5000 --name flask ghcr.io/ourkid1/flask-app:latest

      - name: Wait for app to be ready
        run: sleep 10

      - name: Run ZAP Baseline Scan via GitHub Action
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:5000'
          allow_failures: true
          format: 'HTML'
          output_path: 'zap-report.html'

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
