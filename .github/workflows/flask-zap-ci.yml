name: ZAP Scan with Docker Compose

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write docker-compose.yml
        run: |
          echo 'version: "3"' > docker-compose.yml
          echo 'services:' >> docker-compose.yml
          echo '  flask:' >> docker-compose.yml
          echo '    image: ghcr.io/ourkid1/flask-app:latest' >> docker-compose.yml
          echo '    ports:' >> docker-compose.yml
          echo '      - "5000:5000"' >> docker-compose.yml
          echo '  zap:' >> docker-compose.yml
          echo '    image: owasp/zap2docker-stable' >> docker-compose.yml
          echo '    command: zap-baseline.py -t http://flask:5000 -r zap-report.html' >> docker-compose.yml
          echo '    depends_on:' >> docker-compose.yml
          echo '      - flask' >> docker-compose.yml
          echo '    networks:' >> docker-compose.yml
          echo '      - zapnet' >> docker-compose.yml
          echo '    volumes:' >> docker-compose.yml
          echo '      - ./zap:/zap/wrk' >> docker-compose.yml
          echo 'networks:' >> docker-compose.yml
          echo '  zapnet:' >> docker-compose.yml

      - name: Create output folder for ZAP report
        run: mkdir -p zap

      - name: Run ZAP Scan via Docker Compose
        run: docker compose up --abort-on-container-exit

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/zap-report.html
