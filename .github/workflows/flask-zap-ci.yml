name: Security Scan with OWASP ZAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pull & run your Flask app from GHCR (hot-fix missing python-dotenv)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Flask app
        run: |
          docker pull ghcr.io/ourkid1/flask-app:latest
          docker run -d --name flask -p 5000:5000 \
            -e FLASK_APP=app.py \
            ghcr.io/ourkid1/flask-app:latest \
            sh -c "pip install --no-cache-dir python-dotenv && flask run --host=0.0.0.0 --port=5000"

      # Wait until the app is actually reachable
      - name: Wait for app to be ready (max ~60s)
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/ >/dev/null; then
              echo "App is up"; exit 0
            fi
            sleep 2
          done
          echo "App not reachable, container logs follow:"
          docker logs --tail 200 flask
          exit 1

      # Ensure ZAP can write reports into the workspace
      - name: Make workspace writable for ZAP
        run: chmod -R 777 "${{ github.workspace }}"

      # Run ZAP Baseline and always continue (we'll gate on severity next)
      - name: ZAP Baseline (manual)
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --network=host \
            -v ${{ github.workspace }}:/zap/wrk \
            -w /zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:5000 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html || true

      # Ensure jq is available (usually preinstalled on ubuntu-latest)
      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      # Fail only if HIGH (riskcode >= 3) alerts exist
      - name: Fail only on HIGH ZAP alerts
        run: |
          # riskcode: 0=Info, 1=Low, 2=Medium, 3=High
          if jq -e '[.site[].alerts[] | select((.riskcode|tonumber) >= 3)] | length > 0' report_json.json >/dev/null; then
            echo "High alerts detected. Failing the job."
            jq -r '.site[].alerts[] | select((.riskcode|tonumber) >= 3) | "\(.riskdesc // "High") - \(.alert) @ \(.instances[0].uri // "n/a")"' report_json.json || true
            exit 1
          else
            echo "No HIGH alerts."
          fi

      # Upload the three report files
      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json

      # Always clean up the Flask container
      - name: Stop Flask container
        if: always()
        run: docker rm -f flask || true
