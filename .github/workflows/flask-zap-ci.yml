name: Security Scan with OWASP ZAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR (for your app image)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run Flask app from GHCR
        run: |
          docker pull ghcr.io/ourkid1/flask-app:latest
          docker run -d -p 5000:5000 --name flask ghcr.io/ourkid1/flask-app:latest

      - name: Wait for Flask to be ready
        run: sleep 10

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --network=host \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            ghcr.io/zaproxy/zap:weekly \
            zap-baseline.py -t http://localhost:5000 -r zap-report.html

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
