name: Python CI with Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check app syntax
        run: |
          python -m py_compile app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t my-flask-app .

      - name: Run Docker container and check it works
        run: |
          docker run -d --name flask-test -p 5000:5000 my-flask-app
          sleep 5  # wait for it to start
          docker ps  # confirm it's running
          docker logs flask-test  # output the app logs
