<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name='viewport' content='width=device-width, initial-scale=1.0'/>
  <title>Home</title>
  <!-- Add Tailwind CSS via CDN for easy prototyping -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-black text-white py-4 shadow">
    <div class="container mx-auto flex flex-col md:flex-row justify-between items-center px-4 gap-4">
      <h1 class="text-2xl font-bold tracking-wide">Home page</h1>
      <nav class="space-x-4">
        <a class="navbar-brand text-white bg-blue-600 px-4 py-2 rounded-md font-semibold shadow hover:bg-blue-700 transition" href="/">Home</a>
        <a class="navbar-brand text-white bg-blue-600 px-4 py-2 rounded-md font-semibold shadow hover:bg-blue-700 transition" href="/about">About</a>
        <a class="navbar-brand text-white bg-blue-600 px-4 py-2 rounded-md font-semibold shadow hover:bg-blue-700 transition" href="/contact">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto flex flex-col md:flex-row gap-8 mt-10 px-4">
    <!-- Cart Section -->
    <section class="flex-1 bg-white rounded-xl shadow-lg p-6 mb-8 md:mb-0">
      <h2 class="text-xl font-semibold mb-4">Your Shopping Cart</h2>
      <ul class="cart-items list-disc pl-5 text-gray-700"></ul>
      <div class="cart-total flex items-center justify-between mt-4">
        <span class="text-lg font-semibold">Total:</span>
        <span class="total-price text-2xl font-bold">$0.00</span>
      </div>
      <button class="checkout-btn bg-black text-white rounded-md px-6 py-2 mt-6 font-semibold hover:bg-gray-900 transition">Checkout</button>
    </section>

    <!-- Product Section -->
    <section class="flex-1 bg-white rounded-xl shadow-lg p-6">
      <div class="product">
        <h3 class="text-xl font-bold mb-2">Product Name</h3>
        <p class="text-gray-700 mb-2">Description of the product...</p>
        <p class="text-lg mb-4">Price: $<span class="product-price font-semibold">19.99</span></p>
        <button class="add-to-cart-btn bg-blue-600 text-white rounded-md px-6 py-2 font-semibold hover:bg-blue-700 transition">Add to Cart</button>
      </div>
    </section>
  </main>

  <script>
    const cartItemsList = document.querySelector('.cart-items');
    const totalPriceSpan = document.querySelector('.total-price');
    const checkoutBtn = document.querySelector('.checkout-btn');
    const addToCartBtn = document.querySelector('.add-to-cart-btn');
    const productPriceSpan = document.querySelector('.product-price');

    function addToCart() {
      const itemName = 'Product Name';
      const price = parseFloat(productPriceSpan.textContent);
      const listItem = document.createElement('li');
      listItem.textContent = itemName + ' - $' + price.toFixed(2);
      cartItemsList.appendChild(listItem);
      // Update total, removing $ sign for parse
      totalPriceSpan.textContent = '$' + (parseFloat(totalPriceSpan.textContent.replace('$', '')) + price).toFixed(2);
      alert('"' + itemName + '" added to cart!');
    }

    addToCartBtn.addEventListener('click', addToCart);

    checkoutBtn.addEventListener('click', () => {
      alert('You are being redirected to checkout!');
    });
  </script>
</body>
</html>
